<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milliy Mahsulotlar</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <header class="navbar">
        <div class="nav-container">
          <div class="nav-wrapper">

            <a href="#" class="nav-logo">Milliy<span>Shop</span></a>

            <ul class="nav-links">

              <li><a href="#">Kiyimlar</a></li>
              <li><a href="#">Ro‘zg‘or buyumlari</a></li>

            </ul>

          <div class="nav-actions">

                class="search"
                type="text"
                placeholder="Mahsulot qidirish..."

            <button class="cart-btn">

        </div>
      </header>
      <div class="content">
        <h1 class="page-title">Milliy Mahsulotlar Do‘koni</h1>
        <div class="products-grid" id="products-list"></div>
